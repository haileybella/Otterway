<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otterway Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font: 16px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    #map { flex: 1; min-height: 0; height: auto; }
    #controls { padding: .75rem 1rem; }
    #locate { font: inherit; padding: .5rem .75rem; cursor: pointer; }
    #route-form { margin-top: .5rem; }
    #route-form input, #route-form button { font: inherit; padding: .35rem; }
    #route-form input { width: min(100%, 24rem); box-sizing: border-box; }
    #route-result { max-height: 24vh; overflow: auto; margin-top: .5rem; }
    .flood-legend { background: white; padding: .6rem; border-radius: .4rem; }
    .flood-legend span { display: inline-block; width: .8rem; height: .8rem; margin-right: .35rem; vertical-align: middle; }
    .flood-dot { border: 2px solid #0759a8; border-radius: 50%; box-sizing: border-box; }
    .fema-dot { border: 0; background: #58a9df; }
    .flood-confirmed { background: #0759a8; }
    .flood-area { background: #b9dcfc; border: 1px solid #0759a8; box-sizing: border-box; }
    #status { margin: .5rem 0 0; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="locate" type="button" hidden>Use my location</button>
    <form id="route-form" hidden>
      <label for="start">Starting location</label>
      <input id="start" maxlength="200" placeholder="UTSA Main Campus or use my location">
      <label for="destination">Destination</label>
      <input id="destination" required maxlength="200" placeholder="Texas A&amp;M University–San Antonio">
      <button type="submit">Get directions</button>
    </form>
    <div id="route-result">
      <p id="route-status" role="status"></p>
      <div id="guidance" hidden>
        <p id="maneuver" role="status"></p>
        <button id="start-guidance" type="button">Start voice guidance</button>
        <button id="next-turn" type="button">Next step</button>
        <button id="stop-guidance" type="button" hidden>Stop guidance</button>
      </div>
      <details id="turns" hidden>
        <summary>Turn steps</summary>
        <ol></ol>
      </details>
    </div>
    <p id="status" role="status">Loading the Otterway map…</p>
  </div>
  <div id="map" aria-label="Otterway location map" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
  <script>
    const status = document.getElementById("status");
    if (!window.L) {
      status.textContent = "Leaflet could not load. Check your internet connection and refresh.";
    } else {
      document.getElementById("map").hidden = false;
      status.hidden = true;

      // Leaflet uses latitude, then longitude.
      const point = [29.84302629, -95.63873291];
      const map = L.map("map").setView(point, 16);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      L.marker(point).addTo(map)
        .bindPopup("Bear Creek / west Houston")
        .openPopup();

      const locate = document.getElementById("locate");
      locate.hidden = false;
      let currentPosition;
      let locationDot;
      let accuracyCircle;

      locate.addEventListener("click", () => {
        status.hidden = false;
        if (!window.isSecureContext || !navigator.geolocation) {
          status.textContent = "Location access requires a supported browser on localhost or HTTPS.";
          return;
        }

        locate.disabled = true;
        status.textContent = "Finding your location…";
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => {
            const position = [coords.latitude, coords.longitude];
            currentPosition = { lat: coords.latitude, lon: coords.longitude };
            if (!locationDot) {
              accuracyCircle = L.circle(position, {
                radius: coords.accuracy, color: "#1764d6", fillOpacity: 0.12,
                interactive: false
              }).addTo(map);
              locationDot = L.circleMarker(position, {
                radius: 8, color: "#fff", fillColor: "#1764d6", fillOpacity: 1
              }).addTo(map).bindPopup("Your location");
            } else {
              accuracyCircle.setLatLng(position).setRadius(coords.accuracy);
              locationDot.setLatLng(position);
            }
            map.setView(position, 16);
            locationDot.openPopup();
            if (!routeButton.disabled) start.value = "";
            status.textContent = `Estimated accuracy: ${Math.round(coords.accuracy)} m`;
            locate.disabled = false;
          },
          (error) => {
            const messages = {
              1: "Location access was denied. Allow it in your browser settings and try again.",
              2: "Your device could not determine its location. Try again.",
              3: "The location request timed out. Try again."
            };
            status.textContent = messages[error.code] || "Could not get your location.";
            locate.disabled = false;
          },
          { timeout: 12000 }
        );
      });

      const form = document.getElementById("route-form");
      const start = document.getElementById("start");
      const destination = document.getElementById("destination");
      const routeStatus = document.getElementById("route-status");
      const guidance = document.getElementById("guidance");
      const maneuver = document.getElementById("maneuver");
      const startGuidance = document.getElementById("start-guidance");
      const nextTurn = document.getElementById("next-turn");
      const stopGuidance = document.getElementById("stop-guidance");
      const turns = document.getElementById("turns");
      const stepList = turns.querySelector("ol");
      const routeButton = form.querySelector("button");
      const api = location.port === "8080" && location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8000" : "";
      let routeLayer;
      let endpointMarkers;

      async function resolvePlace(query) {
        const coordinate = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
        const parts = query.split(",").map(part => part.trim());
        if (parts.length === 2 && parts.every(part => coordinate.test(part))) {
          const [lat, lon] = parts.map(Number);
          if (Math.abs(lat) > 90 || Math.abs(lon) > 180) {
            throw new Error("Enter valid coordinates in latitude, longitude order.");
          }
          return { lat, lon, label: lat + ", " + lon };
        }

        const response = await fetch(api + "/api/search?" + new URLSearchParams({ q: query }));
        const place = await response.json();
        if (!response.ok) throw new Error(place.error || "Location lookup failed.");
        return place;
      }

      function endpointMarker(place, fallback) {
        const label = document.createElement("span");
        label.textContent = place.label || fallback;
        return L.marker([place.lat, place.lon]).bindPopup(label);
      }
      let routePoints = [];
      let steps = [];
      let stepIndex = 0;
      let watchId = null;
      const closures = L.geoJSON(null, {
        style: { color: "#b42318", fillOpacity: 0.18 },
        onEachFeature(feature, layer) {
          const label = document.createElement("span");
          label.textContent = feature.properties.label || "Verified closure area";
          layer.bindPopup(label);
        }
      }).addTo(map);

      function showStep(speak = false) {
        const step = steps[stepIndex];
        maneuver.textContent = step.instruction;
        nextTurn.disabled = stepIndex === steps.length - 1;
        if (speak && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(step.instruction));
        }
      }

      function stopTracking() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
          window.speechSynthesis?.cancel();
        }
        stopGuidance.hidden = true;
        startGuidance.hidden = false;
      }

      nextTurn.addEventListener("click", () => {
        stepIndex += 1;
        showStep(watchId !== null);
      });

      startGuidance.addEventListener("click", () => {
        startGuidance.hidden = true;
        stopGuidance.hidden = false;
        showStep(true);
        watchId = navigator.geolocation.watchPosition(({ coords }) => {
          const position = [coords.latitude, coords.longitude];
          currentPosition = { lat: coords.latitude, lon: coords.longitude };
          locationDot.setLatLng(position);
          accuracyCircle.setLatLng(position).setRadius(coords.accuracy);
          map.panTo(position);

          const next = steps[stepIndex + 1];
          const target = next && routePoints[next.way_points?.[0]];
          if (target && coords.accuracy <= 35 &&
              map.distance(position, [target[1], target[0]]) <= 45) {
            stepIndex += 1;
            showStep(true);
            if (stepIndex === steps.length - 1) {
              navigator.geolocation.clearWatch(watchId);
              watchId = null;
              stopGuidance.hidden = true;
            }
          }
        }, () => {
          stopTracking();
          maneuver.textContent = "Location tracking paused. " + steps[stepIndex].instruction;
        }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 2000 });
      });
      stopGuidance.addEventListener("click", stopTracking);
      window.addEventListener("pagehide", stopTracking);

      fetch(api + "/api/closures")
        .then(response => {
          if (!response.ok) throw new Error("Closure data unavailable.");
          return response.json();
        })
        .then(data => {
          if (!routeLayer) closures.clearLayers().addData(data);
        })
        .catch(() => { routeStatus.textContent ||= "Closure data is unavailable."; });

      const metadataPane = map.createPane("metadata");
      metadataPane.style.zIndex = "390";
      const metadataLayer = L.geoJSON(null, {
        filter: feature => feature.geometry?.type === "Point",
        pointToLayer: (feature, point) => L.circleMarker(point, {
          pane: "metadata", radius: 4,
          color: feature.properties.fema_sfha === true ? "#58a9df" : "#525866",
          weight: 1, fillOpacity: 0.65
        }),
        onEachFeature(feature, layer) {
          const label = document.createElement("span");
          const { locality, acquisition_date, image_id, fema_sfha } = feature.properties;
          const hazard = fema_sfha === true ? "FEMA Special Flood Hazard Area"
            : fema_sfha === false ? "Outside FEMA Special Flood Hazard Area"
            : "FEMA hazard status unavailable";
          label.textContent = [locality, acquisition_date, image_id, hazard].filter(Boolean).join(" · ");
          layer.bindPopup(label);
        }
      });
      const hazardPane = map.createPane("hazardFootprints");
      hazardPane.style.zIndex = "380";
      const hazardLayer = L.layerGroup().addTo(map);
      const hazardRenderer = L.svg({ pane: "hazardFootprints" });
      const hazardColors = { moderate: "#d58b39", special: "#37b5c4", floodway: "#236b9b" };
      const layerMenu = L.control.layers({}, {
        "FEMA hazard samples": hazardLayer,
        "All metadata points": metadataLayer
      }).addTo(map);

      const providerPane = map.createPane("providerFloodZones");
      providerPane.style.zIndex = "375";
      const providerStatus = document.createElement("div");
      providerStatus.setAttribute("role", "status");
      if (L.vectorGrid) {
        const providerLayer = L.vectorGrid.protobuf(api + "/api/flood-tiles/{z}/{x}/{y}.mvt", {
          pane: "providerFloodZones",
          minZoom: 10,
          maxNativeZoom: 16,
          maxZoom: 19,
          attribution: "National Flood Data / FEMA",
          vectorTileLayerStyles: {
            default: properties => {
              const floodway = properties.zone_subty === "FLOODWAY";
              const moderate = properties.zone_subty === "0.2 PCT ANNUAL CHANCE FLOOD HAZARD";
              const special = properties.sfha_tf === "T" || properties.sfha_tf === true;
              if (!floodway && !moderate && !special) return [];
              const color = floodway ? "#236b9b" : moderate ? "#d58b39" : "#37b5c4";
              return { color, weight: 1, fill: true, fillColor: color, fillOpacity: 0.28 };
            }
          }
        });
        layerMenu.addOverlay(providerLayer, "National Flood Data zones");
        const updateProviderStatus = () => {
          providerStatus.textContent = map.getZoom() < 10 ? "Zoom in to see National Flood Data zones." : "";
        };
        providerLayer.on("add", updateProviderStatus);
        providerLayer.on("tileerror", () => {
          providerStatus.textContent = "National Flood Data tiles are unavailable.";
        });
        providerLayer.on("remove", () => { providerStatus.textContent = ""; });
        map.on("zoomend", () => {
          if (map.hasLayer(providerLayer)) updateProviderStatus();
        });
      } else {
        providerStatus.textContent = "National Flood Data map renderer could not load.";
      }

      function loadMapData() {
        return fetch(api + "/api/observations")
          .then(response => {
            if (!response.ok) throw new Error("Metadata unavailable.");
            return response.json();
          })
          .then(data => {
            metadataLayer.clearLayers().addData(data);
            hazardLayer.clearLayers();
            const rings = { moderate: [], special: [], floodway: [] };
            for (const { properties } of data.features) {
              const { hazard_band, footprint_bounds } = properties;
              if (!hazard_band || !footprint_bounds) continue;
              const [[south, west], [north, east]] = footprint_bounds;
              rings[hazard_band].push([[[south, west], [south, east], [north, east], [north, west]]]);
            }
            for (const [band, footprints] of Object.entries(rings)) {
              if (!footprints.length) continue;
              L.polygon(footprints, {
                renderer: hazardRenderer, pane: "hazardFootprints", interactive: false,
                stroke: false, fillColor: hazardColors[band], fillOpacity: 0.22, fillRule: "nonzero"
              }).addTo(hazardLayer);
            }
          })
          .catch(() => {
            routeStatus.textContent = "Metadata and FEMA hazard samples are unavailable.";
          });
      }

      metadataLayer.addTo(map);
      const metadataRequest = loadMapData();

      const floodLayer = L.geoJSON(null, {
        filter: feature => feature.geometry.type === "Point",
        pointToLayer: (feature, point) => L.circleMarker(point, {
          radius: 6, color: "#0759a8", weight: 2, fillColor: "#0759a8",
          fillOpacity: feature.properties.status === "confirmed" ? 1 : 0
        }),
        onEachFeature(feature, layer) {
          const label = document.createElement("span");
          const status = feature.properties.status === "confirmed"
            ? "Flood confirmed in source record" : "Unverified flood candidate";
          label.textContent = [status, feature.properties.locality,
            feature.properties.date].filter(Boolean).join(" · ");
          layer.bindPopup(label);
        }
      }).addTo(map);

      const zonePane = map.createPane("floodZones");
      zonePane.style.zIndex = "385";
      const floodZones = L.layerGroup().addTo(map);

      function drawFloodZones(features) {
        // The CSV supplies rectangular footprints. Group overlapping or touching bounds.
        const remaining = features
          .filter(feature => feature.geometry.type === "Polygon")
          .map(feature => ({
            ring: feature.geometry.coordinates[0].map(([lon, lat]) => [lat, lon]),
            status: feature.properties.status
          }));
        for (const footprint of remaining) footprint.bounds = L.latLngBounds(footprint.ring);

        floodZones.clearLayers();
        while (remaining.length) {
          const zone = [remaining.pop()];
          for (const footprint of zone) {
            for (let index = remaining.length - 1; index >= 0; index--) {
              if (footprint.bounds.intersects(remaining[index].bounds)) {
                zone.push(remaining.splice(index, 1)[0]);
              }
            }
          }

          // Render each group in one path so overlaps receive one fill.
          const confirmed = zone.filter(footprint => footprint.status === "confirmed").length;
          L.polygon(zone.map(footprint => [footprint.ring]), {
            pane: "floodZones", renderer: zoneRenderer, stroke: false,
            fillColor: "#0759a8", fillOpacity: 0.28, fillRule: "nonzero"
          }).addTo(floodZones).bindPopup(
            zone.length + " image footprints · " + confirmed + " with confirmed flood observations"
          );
        }
      }

      const zoneRenderer = L.svg({ pane: "floodZones" });

      const legend = L.control({ position: "bottomleft" });
      let floodStatus;
      legend.onAdd = () => {
        const content = L.DomUtil.create("div", "flood-legend");
        content.innerHTML = '<strong>Flood observations</strong>' +
          '<div><span class="flood-dot flood-confirmed"></span>Confirmed location</div>' +
          '<div><span class="flood-dot"></span>Unverified candidate</div>' +
          '<div><span class="flood-area"></span>Connected image footprints</div>' +
          '<div><span class="flood-dot fema-dot"></span>FEMA hazard area point</div>' +
          '<strong>FEMA hazard colors</strong>' +
          '<div><span style="background:#236b9b"></span>Floodway</div>' +
          '<div><span style="background:#37b5c4"></span>Special Flood Hazard Area</div>' +
          '<div><span style="background:#d58b39"></span>0.2% annual flood chance</div>' +
          '<div class="flood-status" role="status"></div>' +
          '<button type="button">Zoom to all points</button>';
        content.querySelector("button").addEventListener("click", () => {
          if (!map.hasLayer(metadataLayer)) metadataLayer.addTo(map);
          Promise.resolve(metadataRequest).then(() => {
            const bounds = metadataLayer.getBounds();
            if (bounds.isValid()) map.fitBounds(bounds, { padding: [24, 24], maxZoom: 16 });
          });
        });
        content.append(providerStatus);
        floodStatus = content.querySelector(".flood-status");
        L.DomEvent.disableClickPropagation(content);
        return content;
      };
      legend.addTo(map);

      let hasFloodData = false;
      async function refreshFloodLayer() {
        try {
          const response = await fetch(api + "/api/floods", { cache: "no-store" });
          if (!response.ok) throw new Error("Flood data unavailable.");
          const data = await response.json();
          drawFloodZones(data.features);
          floodLayer.clearLayers().addData(data);
          const points = data.features.filter(feature => feature.geometry.type === "Point");
          const confirmed = points.filter(feature => feature.properties.status === "confirmed").length;
          floodStatus.textContent = points.length
            ? confirmed + " confirmed · " + (points.length - confirmed) + " candidates"
            : "No flood locations in the CSV";
          hasFloodData = true;
        } catch {
          floodStatus.textContent = hasFloodData
            ? "Refresh failed. Showing last loaded data." : "Flood data unavailable";
        } finally {
          window.setTimeout(refreshFloodLayer, 30000);
        }
      }
      refreshFloodLayer();

      form.hidden = false;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = destination.value.trim();
        if (!query) return;
        const startQuery = start.value.trim();
        const devicePosition = currentPosition;
        stopTracking();
        guidance.hidden = true;
        if (routeLayer) routeLayer.remove();
        if (endpointMarkers) endpointMarkers.remove();
        turns.hidden = true;
        stepList.replaceChildren();
        if (!startQuery && !devicePosition) {
          routeStatus.textContent = "Enter a starting location or choose Use my location.";
          return;
        }

        routeStatus.textContent = "Finding a driving route…";
        routeButton.disabled = true;
        start.readOnly = true;
        destination.readOnly = true;
        try {
          const [origin, place] = await Promise.all([
            startQuery ? resolvePlace(startQuery) : devicePosition,
            resolvePlace(query)
          ]);
          const response = await fetch(api + "/api/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ origin, destination: { lat: place.lat, lon: place.lon } })
          });
          const route = await response.json();
          if (!response.ok) throw new Error(route.error || "Route lookup failed.");
          const feature = route.features?.[0];
          if (!feature) throw new Error("No driving route found.");

          routeLayer = L.geoJSON(feature, { style: { color: "#1764d6", weight: 5 } }).addTo(map);
          endpointMarkers = L.layerGroup([
            endpointMarker(origin, "Your location"),
            endpointMarker(place, "Destination")
          ]).addTo(map);
          map.fitBounds(routeLayer.getBounds(), { padding: [28, 28], maxZoom: 16 });
          const { summary, segments = [] } = feature.properties;
          closures.clearLayers();
          if (route.otterway_closures) closures.addData(route.otterway_closures);
          routePoints = feature.geometry.coordinates;
          steps = segments.flatMap(segment => segment.steps || []);
          stepIndex = 0;
          guidance.hidden = !steps.length;
          startGuidance.hidden = Boolean(startQuery);
          if (startQuery) turns.open = true;
          if (steps.length) showStep();
          for (const step of steps) {
            const item = document.createElement("li");
            item.textContent = step.instruction;
            stepList.append(item);
          }
          turns.hidden = !stepList.children.length;
          routeStatus.textContent = (origin.label || "Your location") + " → " + place.label + " · " +
            Math.round(summary.distance / 1609.344) + " mi · " +
            Math.round(summary.duration / 60) + " min · " +
            (route.otterway_detour ? "Detour avoids mapped flood observations and closures"
              : "Checked against mapped flood observations and closures");
        } catch (error) {
          routeStatus.textContent = error instanceof TypeError
            ? "Otterway’s route server is unavailable. Start or restart server.py and try again."
            : error.message;
        } finally {
          routeButton.disabled = false;
          start.readOnly = false;
          destination.readOnly = false;
        }
      });
    }
  </script>
</body>
</html>
